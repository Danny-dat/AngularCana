<h3>Promo / Ads</h3>

<mat-card class="info">
  <div class="info-row">
    <mat-icon>local_offer</mat-icon>
    <div>
      <div class="info-title">Banner verwalten</div>
      <div class="info-sub">
        <b>Workflow:</b>
        1) Bild auswaehlen → 2) <b>Speichern</b> (Upload + Live) → fertig.
      </div>
    </div>
  </div>
</mat-card>

<div class="grid">
  @for (s of slots; track s.id) {
    <app-promo-slot-editor
      [slotId]="s.id"
      [title]="s.title"
      [subtitle]="s.subtitle">
    </app-promo-slot-editor>
  }
</div>
